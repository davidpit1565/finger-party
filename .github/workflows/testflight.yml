name: TestFlight
# Manual only. Requires repository secrets (never commit these):
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64
# Does NOT submit for App Review — it only uploads a build to App Store Connect / TestFlight.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion (must be higher than any build already uploaded)"
        required: true

jobs:
  upload:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets present
        env:
          T: ${{ secrets.APPLE_TEAM_ID }}
          K: ${{ secrets.ASC_KEY_ID }}
          I: ${{ secrets.ASC_ISSUER_ID }}
          P: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          for v in T K I P; do [ -n "${!v}" ] || { echo "::error::Missing secret for $v (see APPSTORE/TESTFLIGHT-RUNBOOK.md)"; exit 1; }; done
      - run: brew install xcodegen
      - name: Install API key
        env:
          P: ${{ secrets.ASC_KEY_P8_BASE64 }}
          K: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$P" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${K}.p8
      - name: Generate project
        run: xcodegen generate
      - name: Archive
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          K: ${{ secrets.ASC_KEY_ID }}
          I: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive -project FingerPicker.xcodeproj -scheme FingerPicker \
            -configuration Release -destination "generic/platform=iOS" \
            -archivePath build/FingerPicker.xcarchive \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION="${{ inputs.build_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${K}.p8 \
            -authenticationKeyID "$K" -authenticationKeyIssuerID "$I" | tail -40
      - name: Export + upload to App Store Connect
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          K: ${{ secrets.ASC_KEY_ID }}
          I: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > build/ExportOptions.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath build/FingerPicker.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${K}.p8 \
            -authenticationKeyID "$K" -authenticationKeyIssuerID "$I"
